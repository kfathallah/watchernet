services:

  # ─────────────────────────────────────────────
  # 1. Message Broker – NATS
  # ─────────────────────────────────────────────
  nats:
    image: nats:alpine
    container_name: watchernet_nats
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/nats.conf
        port: 4222
        monitor_port: 8222

        websocket {
          port: 9222
          no_tls: true
        }
        EOF
        exec nats-server -c /tmp/nats.conf
    ports:
      - "4222:4222"
      - "8222:8222"
      - "9222:9222"
    networks:
      - surveillance-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # 2. Database – MongoDB 7.0
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: watchernet_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - surveillance-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # 3. Media Server – MediaMTX (RTSP → WebRTC/WHEP)
  # ─────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: watchernet_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"        # RTSP
      - "8889:8889"        # WebRTC / WHEP (HTTP)
      - "8189:8189/udp"    # WebRTC ICE (UDP)
      - "9997:9997"        # API REST MediaMTX
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - surveillance-net

  # ─────────────────────────────────────────────
  # 4. Microservice IA – YOLOv26 ONNX
  # ─────────────────────────────────────────────
  inference:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    container_name: watchernet_inference
    restart: unless-stopped
    environment:
      NATS_URL: nats://watchernet_nats:4222
      MEDIAMTX_RTSP_URL: rtsp://watchernet_mediamtx:8554
      MODEL_PATH: /app/models/best_mlops.onnx
      MODEL_TYPE: yolov26
      CONFIDENCE_THRESHOLD: "0.5"
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"
    volumes:
      - ./inference_service/models:/app/models
    depends_on:
      nats:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - surveillance-net

  # ─────────────────────────────────────────────
  # 5. Backend – FastAPI (Python 3.11)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchernet_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - surveillance-net

  # ─────────────────────────────────────────────
  # 6. Frontend – React / Vite
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: watchernet_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WHEP_BASE_URL: ${VITE_WHEP_BASE_URL}
      VITE_NATS_WS_URL: ${VITE_NATS_WS_URL:-ws://localhost:9222}
    depends_on:
      - backend
    networks:
      - surveillance-net

# ─────────────────────────────────────────────
# Réseaux
# ─────────────────────────────────────────────
networks:
  surveillance-net:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local